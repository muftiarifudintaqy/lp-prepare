<script>
var LINK_SHOPEE = "https://s.shopee.co.id/AAHKYZsFwE";
var PIXEL_ID = "39307323425577961";
var HARGA = 63700;   // harga spesial di gambar LP (Rp63.700)

(function () {
  // Tautan pendek Shopee sudah membawa penanda sumbernya sendiri dan
  // menolak parameter tambahan, jadi dipakai apa adanya.
  var tujuan = LINK_SHOPEE;

  var a = document.getElementById("cta");
  a.href = tujuan;
  // [28 Okt, Kak Adila] klik beli = InitiateCheckout (dulu AddToCart + Lead). [3 Nov] + AddToWishlist (dulu saat buka halaman),
  // masing-masing 1x per klik. Event dikirim dulu,
  // pindah ke Shopee ±300 ms kemudian supaya request Pixel tidak terputus saat halaman ditinggal.
  window.addEventListener("pageshow", function () { a.sedangPergi = false; });   // kembali dari Shopee (tombol back): tombol aktif lagi
  a.addEventListener("click", function (e) {
    if (!window.fbq) return;                                     // Pixel tidak termuat: langsung ke Shopee
    var kirim = function () {
      var data = { content_name: "Lipseed Oil", content_type: "product", currency: "IDR", value: HARGA };   // [4 Nov] + content_type
      fbq("track", "AddToWishlist", data); fbq("track", "InitiateCheckout", data);
    };
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) { kirim(); return; }   // buka di tab baru: biarkan
    e.preventDefault();
    if (a.sedangPergi) return; a.sedangPergi = true;               // klik dobel: event sekali
    var pergi = function () { location.href = tujuan; };
    // fbevents.js belum selesai dimuat (klik cepat / sinyal lemah): event di antrean akan hilang saat pindah
    // halaman, jadi tunggu Pixel siap maks 1,5 dtk; tetap belum siap -> langsung ke Shopee.
    var mulai = Date.now();
    (function tunggu() {
      if (window.fbq && window.fbq.callMethod) { kirim(); setTimeout(pergi, 300); return; }
      if (Date.now() - mulai > 1500) { kirim(); pergi(); return; }
      setTimeout(tunggu, 50);
    })();
  });

})();
</script>
